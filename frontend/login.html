<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <!-- Tampilan login -->
    <section class="login hidden">
        <img class="imgLogo" src="assets/logg.jpeg" alt="logo">
        <form action="" class="formLogin">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Masukkan email anda">
            <div class="formLogin">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Masukkan password anda">
                <i id="togglePassword" class="bi bi-eye"></i>
            </div>
        </form>
        <a href="http://" class="lupaPW">Forgot Password?</a>
        <button class="btn-signIn">Sign in</button>
        <div>
            <button class="btn-google">
                <img src="assets/icons8-google-logo-48.png" alt="image google" class="img-google">
                <span>Sign Up?</span>
            </button>
        </div>
    </section>
<!-- Tampilan login end -->

<!-- Tampilan registrasi -->

    <section class="registrasi">
        <p>Create Your Account</p>
        <form action="" class="formRegis">
            <div>
                <input type="text" name="username" id="username" placeholder="Username">
            </div>
             <div>
                <input type="email" name="email" id="email" placeholder="Email">
            </div>
             <div>
                <input type="password" name="password" id="password" placeholder="Masukkan password anda">
                <i id="togglePassword" class="bi bi-eye"></i>
            </div>
             <div>
                <input type="password" name="password" id="password" placeholder="Masukkan password anda">
                <i id="togglePassword" class="bi bi-eye"></i>
            </div>
        </form>
        <button class="btn-signIn">Sign in</button>
    </section>





    <script>
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    
    togglePassword.addEventListener("click", function () {
    if (password.type === "password") {
        password.type = "text";
        togglePassword.classList.remove("bi-eye");
        togglePassword.classList.add("bi-eye-slash");
    } else {
        password.type = "password";
        togglePassword.classList.remove("bi-eye-slash");
        togglePassword.classList.add("bi-eye");
    }
    });
    </script>
</body>
</html>
