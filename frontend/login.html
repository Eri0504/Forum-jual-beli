<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
    <!-- <link rel="stylesheet" href="https://cloudflare.com"> -->
    <title>Login</title>
</head>
<body>
    <!-- Tampilan login -->
    <section class="login hidden">
        <img class="imgLogo" src="assets/logg.jpeg" alt="logo">
        <form action="" class="formLogin">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Masukkan email anda">
            <div class="formLogin">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Masukkan password anda">
                <i id="togglePassword" class="bi bi-eye"></i>
            </div>
        </form>
        <a href="http://" class="lupaPW">Forgot Password?</a>
        <button class="btn-signIn">Sign in</button>
        <div>
            <button class="btn-google">
                <img src="assets/icons8-google-logo-48.png" alt="image google" class="img-google">
                <span>Sign Up?</span>
            </button>
        </div>
    </section>
<!-- Tampilan login end -->

<!-- Tampilan registrasi -->

    <section class="registrasi hidden">
        <p class="title">Create Your Account</p>
        <form action="" class="formRegis">
            <div>
                <input type="text" name="username" id="username" placeholder="Username">
                <i class="bi bi-person-fill"></i>
            </div>
             <div>
                <input type="email" name="email" id="regemail" placeholder="Email">
                <i class="bi bi-envelope-fill"></i>
            </div>
             <div>
                <input type="password" name="password" id="passwordR1" placeholder="Masukkan password anda">
                <i class="bi bi-lock-fill lock lock1"></i>
                <i id="togglePasswordR1" class="bi bi-eye"></i>
            </div>
             <div>
                <input type="password" name="password" id="passwordR2" placeholder="Konfirmasi password anda">
                <i class="bi bi-lock-fill lock lock2"></i>
                <i id="togglePasswordR2" class="bi bi-eye"></i>
            </div>
        </form>
        <button class="btn-signIn">SUBMIT</button>
    </section>
    <!-- Tampilan regis end -->

    <!-- Forgot Password -->
     <section class="forgot hidden">
        <p class="title">Forgot Your Password?</p>
        <p class="subtitle">Please input your email and continue</p>
        <div class="forgottxt">
            <label for="email" class="email-frg">Email</label>
            <input type="text" name="email" id="frgemail" placeholder="Email">
            <i class="bi bi-envelope-fill amplop"></i>
        </div>
        <button class="btnvery">Verify Email</button>
     </section>
     <!-- Forgot Password End -->

     <!-- Kode OTP -->

     <!-- Kode OTP end -->

     <!-- Check Email -->
       <section class="checkemail">
        <p class="title">Please Check Your email</p>
        <p class="subtitle2">We Send Your Password In Gmail</p>
         <button class="btnvery">Continue</button>
       </section>


    <script>
    const password = document.getElementById("password");
    const passwordR1 = document.getElementById("passwordR1");
    const passwordR2 = document.getElementById("passwordR2");
    const togglePassword = document.getElementById("togglePassword");
    const togglePasswordR1 = document.getElementById("togglePasswordR1");
    const togglePasswordR2 = document.getElementById("togglePasswordR2");
    
    togglePassword.addEventListener("click", function () {
    if (password.type === "password") {
        password.type = "text";
        togglePassword.classList.remove("bi-eye");
        togglePassword.classList.add("bi-eye-slash");
    } else {
        password.type = "password";
        togglePassword.classList.remove("bi-eye-slash");
        togglePassword.classList.add("bi-eye");
    }
    });

    togglePasswordR1.addEventListener("click", function () {
    if (passwordR1.type === "password") {
        passwordR1.type = "text";
        togglePasswordR1.classList.remove("bi-eye");
        togglePasswordR1.classList.add("bi-eye-slash");
    } else {
        passwordR1.type = "password";
        togglePasswordR1.classList.remove("bi-eye-slash");
        togglePasswordR1.classList.add("bi-eye");
    }
    });

    togglePasswordR2.addEventListener("click", function () {
    if (passwordR2.type === "password") {
        passwordR2.type = "text";
        togglePasswordR2.classList.remove("bi-eye");
        togglePasswordR2.classList.add("bi-eye-slash");
    } else {
        passwordR2.type = "password";
        togglePasswordR2.classList.remove("bi-eye-slash");
        togglePasswordR2.classList.add("bi-eye");
    }
    });
    </script>

    
</body>
</html>
